name: CI

on:
    push:
        branches: [master]
    # every PR, not only those targeting master: work lands as stacked branches,
    # and a stacked PR filtered out here reports "no checks" rather than failing
    # — which reads as "nothing to fix" instead of "nothing ran"
    pull_request:

jobs:
    # The matrix verifies the LIBRARY on every Node version we support for
    # consumers (engines: >=20.16). It deliberately does not build: tsdown
    # (rolldown) needs Promise.withResolvers, which is Node 22+, so the build
    # toolchain has a higher floor than the published artifact. Building the
    # same sources three times would verify the bundler, not the library — the
    # artifact is built once, in the lint job, on Node 24.
    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20, 22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run test:coverage

    lint:
        name: Lint & Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Offline: hashes the committed vendored inputs against the digests
            # recorded in sources/SOURCES.json. Catches a tampered or partially
            # updated vendor tree before any dataset is generated from it.
            - run: pnpm run sources:check
            # Regeneration must be a no-op: proves the committed data matches the
            # pinned inputs, which only holds because output is deterministic.
            - run: pnpm run data:check
            - run: pnpm run format:check
            - run: pnpm run lint
            - run: pnpm run typecheck
            - run: pnpm run build
            - run: pnpm run attw

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level moderate
